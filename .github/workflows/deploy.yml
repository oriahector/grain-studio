name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the slow image step: fail fast on lint errors
      - run: pnpm lint

      # AVIF variants are slow to encode; reuse them across runs.
      # scripts/images.mjs only re-encodes sources whose content hash changed.
      - uses: actions/cache@v6
        with:
          path: public/img
          key: images-${{ hashFiles('assets/images/**', 'scripts/images.mjs') }}
          restore-keys: images-

      - name: Build
        # Missing keys get inlined as '' and ship a form that always fails: stop
        # a deploy here instead. PRs from forks and bots get no secrets, so they
        # only need to build.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            : "${NEXT_PUBLIC_EMAILJS_SERVICE_ID:?EMAILJS_SERVICE_ID secret is not set}"
            : "${NEXT_PUBLIC_EMAILJS_TEMPLATE_ID:?EMAILJS_TEMPLATE_ID secret is not set}"
            : "${NEXT_PUBLIC_EMAILJS_PUBLIC_KEY:?EMAILJS_PUBLIC_KEY secret is not set}"
          fi
          pnpm build
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
